<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formar Oraciones - Minjares</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="btn-engrane" class="btn-engrane">⚙️</button>

    <div class="game-container">
        <h2 id="titulo-categoria">Ordena la oración</h2>
        <button id="btn-escuchar" class="btn-icon">🔊 Escuchar la oración</button>
        
        <div id="zona-respuesta" class="zona-drop"></div>
        <div id="zona-palabras" class="zona-drag"></div>

        <button id="btn-revisar" class="btn-accion">Revisar</button>
        <p id="mensaje"></p>
    </div>
    
    <div style="text-align: center;">
        <a href="trazos.html" class="btn-navegacion">✍️ Ir a Remarcar Letras</a>
    </div>

    <!-- MODAL DE LOGIN -->
    <div id="modal-login" class="modal">
        <div class="modal-contenido">
            <h3>Acceso para Maestra</h3>
            <input type="text" id="input-usuario" placeholder="Usuario">
            <input type="password" id="input-password" placeholder="Contraseña">
            <button id="btn-entrar" class="btn-accion">Entrar</button>
            <button class="btn-cerrar-modal" onclick="cerrarModales()">Cancelar</button>
            <p id="msg-login" style="color:red; font-size:14px;"></p>
        </div>
    </div>

    <!-- MODAL DE CONFIGURACIÓN -->
    <div id="modal-config" class="modal">
        <div class="modal-contenido config-contenido">
            <h3>⚙️ Configuración del Juego</h3>
            
            <label><strong>¿Límite total de oraciones a elegir?</strong></label>
            <input type="number" id="input-limite" value="5" min="1" max="22" style="width: 60px;">
            
            <hr>
            <p><strong>Selecciona las oraciones:</strong></p>
            <div id="lista-config-oraciones" class="lista-oraciones"></div>
            
            <!-- Cambiamos el texto del botón -->
            <button id="btn-guardar-config" class="btn-accion">Guardar</button>
            <button class="btn-cerrar-modal" onclick="cerrarModales()">Cerrar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
